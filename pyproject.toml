[project]
name = "cashkit"
version = "0.1.0"
description = "Deterministic cash-flow modelling engine with an SDK-only surface, built for LLM agents."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Luca Sorgiacomo" }]
dependencies = [
    "pydantic>=2",
    "numpy>=1.26",
    "pyyaml>=6",
    "python-dateutil>=2.8",
    "holidays>=0.40",
]

[project.optional-dependencies]
duckdb = ["duckdb>=1.5"]
git = ["pygit2>=1.14"]
all = ["cashkit[duckdb,git]"]

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6.100",
    "duckdb>=1.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cashkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "benchmark: asserts a PRD §5.2 performance budget; timing-sensitive, deselect with -m 'not benchmark'",
]
