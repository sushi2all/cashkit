[project]
name = "cashkit"
version = "0.1.0"
description = "Deterministic cash-flow modelling engine with an SDK-only surface, built for LLM agents."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Luca Sorgiacomo" }]
dependencies = [
    "pydantic>=2",
    "numpy>=1.26",
    "pyyaml>=6",
    "python-dateutil>=2.8",
    "holidays>=0.40",
]

[project.scripts]
cashkit = "cashkit.cli:main"

[project.optional-dependencies]
duckdb = ["duckdb>=1.5"]
git = ["pygit2>=1.14"]
all = ["cashkit[duckdb,git]"]

[dependency-groups]
proto = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "openpyxl>=3.1",
    "python-multipart>=0.0.9",
]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6.100",
    "duckdb>=1.5",
    "pygit2>=1.14",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cashkit"]

# The app track (SPEC-mlp-consumer.md) lives in a uv workspace member. The
# engine package and its test configuration below are untouched by it:
# `uv run pytest` still runs `testpaths = ["tests"]`, the engine suite only.
# App tests are explicit — `uv run pytest apps/service/tests` — and resolve
# their own config from `apps/service/pyproject.toml`.
[tool.uv.workspace]
members = ["apps/service"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "benchmark: asserts a PRD §5.2 performance budget; timing-sensitive, deselect with -m 'not benchmark'",
]

# The coverage gate. Two invocations, deliberately:
#
#   uv run pytest                              — the default. No instrumentation,
#                                                so the §5.2 benchmarks measure
#                                                the engine and not coverage.py's
#                                                trace hook (they fail under it).
#   uv run pytest -m "not benchmark" --cov     — the gate. Fails below 90%.
#
# `addopts` deliberately does NOT carry `--cov`: a default run that instruments
# `engine/` is a default run whose performance assertions are meaningless.
# `--cov` with no value reads `source` below, and `fail_under` is what makes the
# run exit non-zero — the threshold lives here so neither invocation nor CI can
# quietly lower it. `tests/test_coverage_gate.py` asserts this block is intact.
[tool.coverage.run]
source = ["cashkit/engine", "cashkit/model"]
branch = false

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
