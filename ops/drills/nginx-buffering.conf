# The negative control for the streaming drill. NOT a deployment artifact.
#
# It exists to make the drill's timing assertion provably able to detect a
# buffered stream. A test that only ever sees the good case cannot claim to
# detect the bad one.
#
# Getting a proxy to buffer took two tries, and both failures are worth
# recording, because both are corrections to the folklore:
#
# 1. nginx **honours** an upstream `X-Accel-Buffering: no` and turns buffering
#    off for that response. That is precisely why the service sends the header
#    (`routers/imports.py`), and it is why this control has to ignore it.
# 2. `proxy_buffering on` alone still did not buffer. nginx's response
#    buffering protects the upstream from a slow *client*; for a slow
#    *producer* that flushes each chunk, nginx forwards each chunk as it
#    arrives. "nginx breaks SSE" is true, but not for the reason usually given.
#
# What actually breaks it is **compression**: gzip cannot emit until it has
# enough input, so nginx holds the whole response — response headers included —
# until the run ends, and the client sees nothing and then everything at once.
# That is the real misconfiguration people hit, and it is the one modelled here.
server {
    listen 8080;

    gzip on;
    gzip_types *;
    gzip_min_length 1;
    gzip_proxied any;

    location / {
        proxy_pass http://service:8000;
        proxy_http_version 1.1;
        proxy_buffering on;
        proxy_ignore_headers X-Accel-Buffering;
        proxy_read_timeout 300s;
    }
}
