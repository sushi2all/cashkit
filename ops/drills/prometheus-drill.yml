# Prometheus for the alarm drill only. NOT a deployment artifact —
# `ops/observability/prometheus.yml` is the one the VM runs.
#
# It differs in exactly three ways, all of them about speed and none of them
# about a rule:
#   * one-second scrape and evaluation, so an alarm fires in seconds;
#   * the rule file is the generated short-`for:` copy of
#     `ops/observability/alerts.yml`, whose expressions the drill asserts are
#     unchanged;
#   * no remote_write — there is no Grafana Cloud in a drill.
#
# The `cashkit-service` job points at a host that does not exist, on purpose:
# that is how the uptime alarm is driven. `up == 0` is generated by a scrape
# that genuinely fails, not by a fabricated series.
global:
  scrape_interval: 1s
  evaluation_interval: 1s
  external_labels:
    environment: drill
    service: cashkit

rule_files:
  - /etc/prometheus/rules/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # The synthetic series: model spend, repair ratio, disk, backup marker, the
  # deletion window. Rewritten between phases of the drill.
  - job_name: fixtures
    metrics_path: /metrics
    static_configs:
      - targets: ["fixtures:9101"]

  # Deliberately unreachable. This is the uptime alarm's input.
  - job_name: cashkit-service
    static_configs:
      - targets: ["service-that-is-not-running:8000"]

  # The synthetic external probe. `probe_success` comes from the fixture file,
  # because a genuine blackbox probe of a site that does not exist would test
  # the probe rather than the rule.
  - job_name: cashkit-uptime
    metrics_path: /metrics
    static_configs:
      - targets: ["fixtures:9101"]
