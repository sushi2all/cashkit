# The on-VM metrics agent (SPEC §11).
#
# It scrapes and it remote-writes. It does **not** hold the alert rules and it
# does not run the uptime probe: those live in Grafana Cloud (EU), because an
# alarm that dies with the box is not an alarm. Six hours of local retention is
# enough to survive a remote-write outage and no more — this is not a store.
#
# `ops/observability/alerts.yml` is the rule file, uploaded to Grafana Cloud;
# it is in the repository so it is reviewable, and the alarm drill loads it
# into a real Prometheus to prove every rule fires.
global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    # No user identifier anywhere, here included: these two say which box a
    # series came from and nothing about who was using it.
    environment: "${CASHKIT_ENVIRONMENT}"
    service: cashkit

scrape_configs:
  - job_name: cashkit-service
    metrics_path: /metrics
    static_configs:
      - targets: ["service:8000"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

remote_write:
  - url: "${GRAFANA_CLOUD_PROM_URL}"
    basic_auth:
      username: "${GRAFANA_CLOUD_PROM_USER}"
      password: "${GRAFANA_CLOUD_PROM_TOKEN}"
    queue_config:
      # Keep half a day of samples if Grafana Cloud is unreachable, so an
      # outage there does not turn into a hole in the alarm history here.
      max_samples_per_send: 1000
      capacity: 10000
      max_shards: 10
