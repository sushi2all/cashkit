[project]
name = "cashkit-service"
version = "0.1.0"
description = "CashKit MLP consumer service — FastAPI over the cashkit SDK."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Luca Sorgiacomo" }]
dependencies = [
    "cashkit",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2",
    "email-validator>=2",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "python-multipart>=0.0.9",
    "openpyxl>=3.1",
    # `compare()`, `frame()` and `pivot()` live behind the engine's duckdb
    # extra; without it they answer CK-E033 instead of a payload, and
    # GET /book/compare is a SPEC §3 endpoint (D-MLP-10).
    "duckdb>=1.5",
    "pygit2>=1.14",
    # The agent layer's model transport (SPEC §2.3). Async, because the whole
    # service runs on the event-loop thread.
    "httpx>=0.27",
    "sentry-sdk>=2.20",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cashkit_service"]

[tool.uv.sources]
cashkit = { workspace = true }

# App tests are explicit: `uv run pytest apps/service/tests`. The root
# pyproject keeps `testpaths = ["tests"]` so a bare `uv run pytest` still runs
# the engine suite and only the engine suite.
[tool.pytest.ini_options]
asyncio_mode = "auto"
# The SPEC §10 trials are named for the trial they encode (t13_…, t17_…),
# not test_…; pytest must still collect them.
python_files = ["test_*.py", "t[0-9][0-9]_*.py"]
markers = [
    "live_model: calls OpenRouter for real (SPEC §10: nightly and pre-release, not per-commit)",
    "drill: builds a container image and starts a stack (the S6 restore and alarm drills)",
]
# SPEC §10: trials that call OpenRouter run on a schedule, not on every commit.
# The default run therefore excludes them; the live run is
# `uv run pytest apps/service/trials -m live_model`.
addopts = "-m 'not live_model and not drill'"
